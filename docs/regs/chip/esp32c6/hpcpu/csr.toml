[[regs]]
name = "CPU_GPIO_OEN"
desc = "GPIO Output Enable"
offset = 0x0803

	[[regs.fields]]
	name = "CPU_GPIO_OEN"
	desc = "Configures whether to enable GPIOn (n=0 ~ 21) output. CPU_GPIO_OEN[7:0] correspond to output enable signals cpu_gpio_out_oen[7:0] in GPIO Matrix. 0: Disable GPIO output 1: Enable GPIO output"
	bits = "7:0"
	reset = 0x0
	access = "R/W"

[[regs]]
name = "CPU_GPIO_IN"
desc = "GPIO Input Value"
offset = 0x0804

	[[regs.fields]]
	name = "CPU_GPIO_IN"
	desc = "Represents GPIOn (n=0 ~ 21) input value (1=high, 0=low). CPU_GPIO_IN[7:0] correspond to input signals cpu_gpio_in[7:0] in GPIO Matrix and can only be mapped to GPIO pins through GPIO matrix"
	bits = "7:0"
	reset = 0x0
	access = "RO"

[[regs]]
name = "CPU_GPIO_OUT"
desc = "GPIO Output Value"
offset = 0x0805

	[[regs.fields]]
	name = "CPU_GPIO_OUT"
	desc = "Configures GPIOn (n=0 ~ 21) output value (1=high, 0=low). The value takes effect only when CPU_GPIO_OEN is set. CPU_GPIO_OUT[7:0] correspond to output signals cpu_gpio_out[7:0] in GPIO Matrix and can only be mapped to GPIO pins through GPIO matrix"
	bits = "7:0"
	reset = 0x0
	access = "R/W"

[[regs]]
name = "PMA_CFG"
desc = "Physical memory attribute configuration"
offset = 0x0BC0
count = 16
stride = 1

	[[regs.fields]]
	name = "TYPE"
	desc = "Configures region type. 0x0: Invalid memory region (RWX access will be treated as 0, even if programmed to 1) 0x1: Valid memory region (Programmed RWX access will be applicable)"
	bits = "0"
	reset = 0x0
	access = "R/W"

	[[regs.fields]]
	name = "EXECUTE"
	desc = "Configures execute-permission for the corresponding region. 0: Execution not allowed 1: Execution allowed"
	bits = "2"
	reset = 0x0
	access = "R/W"

	[[regs.fields]]
	name = "WRITE"
	desc = "Configures write-permission for the corresponding region. 0: Write not allowed 1: Write allowed"
	bits = "3"
	reset = 0x0
	access = "R/W"

	[[regs.fields]]
	name = "READ"
	desc = "Configures read-permission for the corresponding region. 0: Read not allowed 1: Read allowed"
	bits = "4"
	reset = 0x0
	access = "R/W"

	[[regs.fields]]
	name = "ATTRIBUTE"
	desc = "Configures the values to be driven on DRAM attribute ports"
	bits = "27:24"
	reset = 0x0
	access = "R/W"

	[[regs.fields]]
	name = "LOCK"
	desc = "Configures whether to lock the corresponding pma_cfgX and pma_addrX. 0: Not locked 1: Locked. The write permission to the corresponding pma_cfgX and pma_addrX is revoked. It can only be unlocked by core reset"
	bits = "29"
	reset = 0x0
	access = "R/W"

	[[regs.fields]]
	name = "A"
	desc = "Configures address type. The functionality is the same as pmpcfg register's A field. 0x0: OFF 0x1: TOR 0x2: NA4 0x3: NAPOT"
	bits = "31:30"
	reset = 0x2
	access = "R/W"

