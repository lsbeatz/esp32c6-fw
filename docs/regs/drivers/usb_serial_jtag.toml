	desc = "Configures the pull up value when USB_SERIAL_JTAG_PAD_PULL_OVERRIDE is 1"
	bits = "13"
	reset = 0x0
	access = "R/W"

	[[regs.fields]]
	name = "PAD_ENABLE"
	desc = "Configures whether to enable USB pad function"
	bits = "14"
	reset = 0x1
	access = "R/W"

	[[regs.fields]]
	name = "BRIDGE_EN"
	desc = "Configures whether to disconnect usb_jtag and internal JTAG"
	bits = "15"
	reset = 0x0
	access = "R/W"

