	reset = 0x1
	access = "R/W"

	[[regs.fields]]
	name = "DP_PULLDOWN"
	desc = "Configures whether to enable USB D+ pull down when USB_SERIAL_JTAG_PAD_PULL_OVERRIDE is 1"
	bits = "10"
	reset = 0x0
	access = "R/W"

	[[regs.fields]]
