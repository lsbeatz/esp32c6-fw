desc = "FIFO access for the CDC-ACM data IN and OUT endpoints"
offset = 0x0000

	[[regs.fields]]
	name = "RDWR_BYTE"
	desc = "Write or read byte data to or from UART TX/RX FIFO"
	bits = "7:0"
	reset = 0x0
	access = "R/W"

