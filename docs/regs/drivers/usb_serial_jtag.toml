	desc = "Configures whether to enable USB D- pull up when USB_SERIAL_JTAG_PAD_PULL_OVERRIDE is 1"
	bits = "11"
	reset = 0x0
	access = "R/W"

	[[regs.fields]]
	name = "DM_PULLDOWN"
	desc = "Configures whether to enable USB D- pull down when USB_SERIAL_JTAG_PAD_PULL_OVERRIDE is 1"
	bits = "12"
	reset = 0x0
	access = "R/W"

	[[regs.fields]]
